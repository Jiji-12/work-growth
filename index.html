<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="仕事と成長"><link rel="manifest" href="manifest.json"><title>仕事と成長</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:680px;margin:auto;padding:24px 18px 48px}h1{font-size:28px;margin:6px 0}.sub,.small{color:#777}.card{background:#fff;border:1px solid #e7e7e4;border-radius:18px;padding:18px;margin:12px 0}label{display:block;font-weight:700;margin:12px 0 8px}textarea{width:100%;min-height:85px;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit;resize:vertical}.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scorebox{border:1px solid #e5e5e5;border-radius:14px;padding:12px}.score{font-size:34px;font-weight:800}input[type=range]{width:100%}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:#222;color:white}button.secondary{background:#eee;color:#222}.actions{display:flex;gap:8px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f3f3f0;border-radius:14px;padding:12px}.num{font-size:23px;font-weight:800}.entry{padding:13px 0;border-bottom:1px solid #eee}.entry:last-child{border:0}.install{background:#f0f0ec}canvas{width:100%;height:190px}</style></head><body><main><h1>仕事と成長</h1><p class="sub">1日の仕事量と、今日の自分の成長を記録する。</p><div class="card install"><b>iPhoneで使う</b><p class="small">Safariで公開URLを開き、「共有」→「ホーム画面に追加」でアイコンを作れます。</p></div><div class="card"><div class="row"><h2 id="title">今日の記録</h2><span class="small" id="date"></span></div><label>今日やった仕事</label><textarea id="work" placeholder="例：資料作成、調査、メール対応…"></textarea><label>今日できるようになったこと・気づいたこと</label><textarea id="growth" placeholder="小さなことでもOK"></textarea><div class="scores"><div class="scorebox"><label>仕事量</label><div class="score" id="ws">5</div><input id="wr" type="range" min="0" max="10" value="5"></div><div class="scorebox"><label>成長度</label><div class="score" id="gs">5</div><input id="gr" type="range" min="0" max="10" value="5"></div></div><div class="actions"><button id="save">今日の記録を保存</button><button class="secondary" id="clear">クリア</button></div></div><div class="card"><h2>最近の傾向</h2><div class="stats"><div class="stat"><div class="small">7日仕事量</div><div class="num" id="aw">-</div></div><div class="stat"><div class="small">7日成長</div><div class="num" id="ag">-</div></div><div class="stat"><div class="small">記録日数</div><div class="num" id="days">0</div></div></div><canvas id="chart" width="640" height="190"></canvas></div><div class="card"><div class="row"><h2>記録一覧</h2><button class="secondary" id="export">バックアップ</button></div><div id="list"></div></div></main><script>
const K="work-growth-v1",Q=id=>document.getElementById(id),D=()=>new Date().toLocaleDateString("sv-SE"),fmt=d=>new Date(d+"T00:00").toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"}),load=()=>JSON.parse(localStorage.getItem(K)||"[]"),save=a=>localStorage.setItem(K,JSON.stringify(a));
function scores(){Q("ws").textContent=Q("wr").value;Q("gs").textContent=Q("gr").value}Q("wr").oninput=scores;Q("gr").oninput=scores;Q("date").textContent=fmt(D());
Q("save").onclick=()=>{let a=load().filter(x=>x.date!==D());a.unshift({date:D(),work:Q("work").value.trim(),growth:Q("growth").value.trim(),w:+Q("wr").value,g:+Q("gr").value});save(a);render();Q("title").textContent="今日の記録を編集"};
Q("clear").onclick=()=>{Q("work").value="";Q("growth").value="";Q("wr").value=Q("gr").value=5;scores()};
Q("export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}));a.download="仕事と成長バックアップ.json";a.click()};
function render(){let a=load().sort((x,y)=>y.date.localeCompare(x.date)),r=a.filter(x=>(Date.now()-new Date(x.date+"T00:00"))/864e5<7);let av=k=>r.length?(r.reduce((s,x)=>s+x[k],0)/r.length).toFixed(1):"-";Q("aw").textContent=av("w");Q("ag").textContent=av("g");Q("days").textContent=r.length;Q("list").innerHTML=a.slice(0,20).map(x=>`<div class="entry"><div class="row"><b>${fmt(x.date)}</b><span class="small">仕事量 ${x.w} / 成長 ${x.g}</span></div><div>${esc(x.work)}</div><div class="small">成長：${esc(x.growth)}</div></div>`).join("")||'<p class="small">まだ記録がありません。</p>';draw(a.slice(0,14).reverse())}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function draw(a){let c=Q("chart"),x=c.getContext("2d"),w=c.width,h=c.height,p=35,ch=120;x.clearRect(0,0,w,h);if(!a.length){x.fillStyle="#888";x.fillText("記録すると推移が表示されます",20,80);return}function line(k,dash){x.beginPath();a.forEach((v,i)=>{let X=p+(a.length==1?300:i*(w-70)/(a.length-1)),Y=p+ch-v[k]*ch/10;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle=dash?"#999":"#222";x.lineWidth=3;x.stroke()}line("w");line("g",1)}
render();(async()=>{if("serviceWorker"in navigator)try{await navigator.serviceWorker.register("sw.js")}catch(e){}})();
</script></body></html>
